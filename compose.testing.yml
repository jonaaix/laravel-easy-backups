services:
    mysql_test:
        image: mysql:8.0
        ports:
            - '33061:3306'
        environment:
            MYSQL_ROOT_PASSWORD: password
            MYSQL_DATABASE: test
        volumes:
            - ./tests/temp:/app/temp
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '--protocol=tcp', '-uroot', '-ppassword']
            interval: 2s
            timeout: 5s
            retries: 60

    mariadb_test:
        image: mariadb:lts
        ports:
            - '33062:3306'
        environment:
            MYSQL_ROOT_PASSWORD: password
            MYSQL_DATABASE: test
        volumes:
            - ./tests/temp:/app/temp
        healthcheck:
            test: ['CMD', 'mariadb-admin', 'ping', '-h', '127.0.0.1', '--protocol=tcp', '-uroot', '-ppassword']
            interval: 2s
            timeout: 5s
            retries: 60

    pgsql_test:
        image: postgres:15
        ports:
            - '33063:5432'
        environment:
            POSTGRES_PASSWORD: password
            POSTGRES_DB: test
            POSTGRES_USER: user
        volumes:
            - ./tests/temp:/app/temp
        healthcheck:
            test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'user', '-d', 'test']
            interval: 2s
            timeout: 5s
            retries: 60
